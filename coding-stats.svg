<svg width="100%" viewBox="0 0 680 234" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Coding stats</title>
  <desc>Commits and lines coded for today, this week, this month and this year</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    /* light (GitHub light) */
    .card  { fill: #ffffff; stroke: #d0d7de; }
    .line  { stroke: #d0d7de; }
    .title { fill: #1f2328; }
    .muted { fill: #59636e; }
    .num   { fill: #0969da; }
    .lines { fill: #1a7f37; }
    /* dark (GitHub dark) */
    @media (prefers-color-scheme: dark) {
      .card  { fill: #0d1117; stroke: #30363d; }
      .line  { stroke: #30363d; }
      .title { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .num   { fill: #58a6ff; }
      .lines { fill: #3fb950; }
    }
  </style>

  <rect class="card" x="20.5" y="20.5" width="639" height="193" rx="12" stroke-width="1"/>
  <text class="title" x="44" y="52" font-size="14" font-weight="500">Coding stats</text>

  <line class="line" x1="190" y1="68" x2="190" y2="178"/>
  <line class="line" x1="350" y1="68" x2="350" y2="178"/>
  <line class="line" x1="510" y1="68" x2="510" y2="178"/>

  <!-- Today -->
  <text class="muted" x="44" y="88" font-size="12">Today</text>
  <text class="num" x="44" y="124" font-size="30" font-weight="500">4</text>
  <text class="muted" x="44" y="142" font-size="12">commits</text>
  <text class="lines" x="44" y="168" font-size="16" font-weight="500">312</text>
  <text class="muted" x="44" y="186" font-size="12">lines coded</text>

  <!-- This week -->
  <text class="muted" x="204" y="88" font-size="12">This week</text>
  <text class="num" x="204" y="124" font-size="30" font-weight="500">19</text>
  <text class="muted" x="204" y="142" font-size="12">commits</text>
  <text class="lines" x="204" y="168" font-size="16" font-weight="500">1,840</text>
  <text class="muted" x="204" y="186" font-size="12">lines coded</text>

  <!-- This month -->
  <text class="muted" x="364" y="88" font-size="12">This month</text>
  <text class="num" x="364" y="124" font-size="30" font-weight="500">63</text>
  <text class="muted" x="364" y="142" font-size="12">commits</text>
  <text class="lines" x="364" y="168" font-size="16" font-weight="500">7,225</text>
  <text class="muted" x="364" y="186" font-size="12">lines coded</text>

  <!-- This year -->
  <text class="muted" x="524" y="88" font-size="12">This year</text>
  <text class="num" x="524" y="124" font-size="30" font-weight="500">512</text>
  <text class="muted" x="524" y="142" font-size="12">commits</text>
  <text class="lines" x="524" y="168" font-size="16" font-weight="500">58,410</text>
  <text class="muted" x="524" y="186" font-size="12">lines coded</text>
</svg>

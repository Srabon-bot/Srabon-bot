<svg xmlns="http://www.w3.org/2000/svg" width="620" height="82" viewBox="0 0 620 82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<style>
.n{fill:#424a53}
.s{fill:#8c959f}
@media(prefers-color-scheme:dark){.n{fill:#f0f6fc}.s{fill:#8b949e}}
.breathe{animation:breathe 6s ease-in-out 1.50s infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:0.15}}
</style>
<clipPath id="c0"><rect x="0" y="4" height="44" width="0"><animate attributeName="width" from="0" to="620" begin="0.00s" dur="0.80s" fill="freeze"/></rect></clipPath>
<clipPath id="c1"><rect x="0" y="50" height="30" width="0"><animate attributeName="width" from="0" to="620" begin="0.90s" dur="0.60s" fill="freeze"/></rect></clipPath>
<g class="breathe">
  <g clip-path="url(#c0)"><text xml:space="preserve" x="310" y="40" class="n" font-size="28" font-weight="600" text-anchor="middle">Shahriar Srabon</text></g>
  <g clip-path="url(#c1)"><text xml:space="preserve" x="310" y="72" class="s" font-size="14" text-anchor="middle">Web Developer · ML Engineer</text></g>
  <rect y="6" width="4" height="36" class="n" opacity="0">
    <animate attributeName="x" from="0" to="620" begin="0.00s" dur="0.80s" fill="freeze"/>
    <set attributeName="opacity" to="0.8" begin="0.00s"/>
    <set attributeName="opacity" to="0" begin="0.80s"/>
  </rect>
  <rect y="52" width="3" height="22" class="s" opacity="0">
    <animate attributeName="x" from="0" to="620" begin="0.90s" dur="0.60s" fill="freeze"/>
    <set attributeName="opacity" to="0.8" begin="0.90s"/>
    <set attributeName="opacity" to="0" begin="1.50s"/>
  </rect>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="620" height="40" viewBox="0 0 620 40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<style>
.s{fill:#8c959f}
@media(prefers-color-scheme:dark){.s{fill:#8b949e}}
.breathe{animation:breathe 6s ease-in-out 1.20s infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:0.15}}
</style>
<clipPath id="c1"><rect x="0" y="4" height="30" width="0"><animate attributeName="width" from="0" to="620" begin="0.60s" dur="0.60s" fill="freeze"/></rect></clipPath>
<g class="breathe">
  <g clip-path="url(#c1)"><text xml:space="preserve" x="310" y="26" class="s" font-size="16" font-weight="600" text-anchor="middle">Web Developer · ML Engineer</text></g>
  <rect y="6" width="3" height="24" class="s" opacity="0">
    <animate attributeName="x" from="0" to="620" begin="0.60s" dur="0.60s" fill="freeze"/>
    <set attributeName="opacity" to="0.8" begin="0.60s"/>
    <set attributeName="opacity" to="0" begin="1.20s"/>
  </rect>
</g>
</svg>
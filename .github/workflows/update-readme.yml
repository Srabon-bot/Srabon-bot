name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the other README-writing jobs so their pushes can never race.
concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build recent repos list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$OWNER/repos?sort=pushed&per_page=10" > repos.json
          # Authenticated so we are not at the mercy of the shared runner IP's
          # 60/hour anonymous limit, but keep the list to PUBLIC repos: this
          # README is public, so private repo names must not leak into it.
          # Keep only the two most recently pushed public repos.
          jq -r --arg owner "$OWNER" '
            if type != "array" then error("unexpected GitHub API response") else . end
            | map(select(.private == false and .name != $owner))
            | .[0:2][]
            | "- [\(.name)](\(.html_url)) - \(.description // "no description yet")"
          ' repos.json > list.md
          rm -f repos.json
          # Never commit an empty section because of a transient API hiccup.
          test -s list.md

      - name: Insert into README
        run: |
          awk 'FNR==NR{new=new $0 "\n"; next}
               /<!--START-->/{print; printf "%s", new; skip=1; next}
               /<!--END-->/{skip=0}
               !skip' list.md README.md > tmp.md
          mv tmp.md README.md
          rm list.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update recent projects"
          git pull --rebase
          git push

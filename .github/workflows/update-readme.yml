name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build recent repos list
        run: |
          curl -s "https://api.github.com/users/${{ github.repository_owner }}/repos?sort=pushed&per_page=6" \
            | jq -r '.[] | select(.name != "${{ github.repository_owner }}") | "- [\(.name)](\(.html_url)) - \(.description // "no description yet")"' \
            | head -5 > list.md

      - name: Insert into README
        run: |
          awk 'FNR==NR{new=new $0 "\n"; next}
               /<!--START-->/{print; printf "%s", new; skip=1; next}
               /<!--END-->/{skip=0}
               !skip' list.md README.md > tmp.md
          mv tmp.md README.md
          rm list.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update recent projects"
          git push
